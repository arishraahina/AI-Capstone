<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>

  <!-- Link the external stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Centered wrapper that holds the settings card -->
  <main class="page-wrapper">

    <section class="settings-card">

      <!-- Card header -->
      <div class="card-header">
        <h1 class="card-title">Account Settings</h1>
        <p class="card-subtitle">Update your name and email address.</p>
      </div>

      <!-- Success message, hidden by default and shown after a valid save -->
      <div class="success-message" id="successMessage" role="status" aria-live="polite" tabindex="-1">
        ✅ Your settings have been saved successfully.
      </div>

      <!-- novalidate turns off the browser's built-in validation bubbles,
           since we show our own custom error messages instead -->
      <form id="settingsForm" novalidate>

        <!-- Name field -->
        <div class="form-group">
          <label for="nameInput">Full Name <span class="required-star">*</span></label>
          <input
            type="text"
            id="nameInput"
            name="name"
            placeholder="Enter your full name"
            autocomplete="name"
          >
          <!-- Error text shows only when validation fails -->
          <p class="error-text" id="nameErrorText"></p>
        </div>

        <!-- Email field -->
        <div class="form-group">
          <label for="emailInput">Email Address <span class="required-star">*</span></label>
          <input
            type="email"
            id="emailInput"
            name="email"
            placeholder="Enter your email address"
            autocomplete="email"
          >
          <p class="error-text" id="emailErrorText"></p>
        </div>

        <!-- Save button -->
        <button type="submit" class="save-button">Save Changes</button>

      </form>

    </section>

  </main>

  <!-- Link the external JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
